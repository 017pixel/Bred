name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  syntax-check:
    name: JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JS syntax (ES modules)
        run: |
          for f in js/*.js sw.js; do
            node --input-type=module --check < "$f"
          done
      - name: Check HTML references
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const refs = [...html.matchAll(/(?:src|href)=\"([^\"]+)\"/g)].map(m => m[1])
              .filter(r => !r.startsWith('http') && !r.startsWith('#') && r !== 'manifest.json');
            const missing = refs.filter(r => !fs.existsSync(r.replace(/[?#].*$/, '')));
            if (missing.length) {
              console.error('Fehlende Referenzen:', missing);
              process.exit(1);
            }
            console.log('Alle', refs.length, 'Referenzen vorhanden');
          "

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: syntax-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          exclude: |
            .git
            .github
            .playwright-mcp
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
